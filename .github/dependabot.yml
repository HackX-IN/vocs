# SOURCE OF TRUTH KEYWORDS: dependabot, dependency updates, cargo, npm, github-actions, major-bumps
# WHAT:  Weekly update PRs for the three dependency surfaces: Rust crates, the pnpm workspace, and the
#        GitHub Actions the workflows pin. Minor and patch updates only, grouped.
# WHY:   Major versions are IGNORED, deliberately. The first week of this file opened fifteen PRs and
#        six of them failed CI: a three-crate jump in `candle` that powers the on-device grammar
#        model, TypeScript 5 to 7, and a bump of `tauri-action`, which is the step that builds,
#        signs and publishes. A major upgrade is a decision with a migration attached, not a chore
#        to approve in a list, so it is made by hand (`cargo upgrade` / `pnpm up --latest`) when
#        wanted. Minor and patch bumps arrive as ONE grouped PR per ecosystem so CI judges the week
#        together, and the action pins update monthly because a changed action is a changed release
#        pipeline and weekly is more attention than it deserves.
# WHERE: Read by GitHub; the PRs it opens run .github/workflows/ci.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
