<!--
  SOURCE OF TRUTH KEYWORDS: mark.svg, identity-mark, tray-icon, pill-logo, whisper-head, template-image
  WHAT:  Vocs's identity mark — the head-shaped blob with two quote marks cut out of
         it, as ONE solid colour, on a 0..100 grid, cropped tight to the head.
  WHY:   The same drawing as the app icon (assets/icon.svg) minus the paper and the
         gradients, so the icon, the menu-bar glyph, the pill and the in-app logo
         read as one object. The quotes are CUT OUT with a mask rather than painted
         white: as a macOS template image the system recolours the glyph for light,
         dark and the pressed menu-bar state, so it must carry no colour of its own
         and the quotes must be holes, not a second colour.
  WHERE: Rendered to src-tauri/icons/tray.png / tray@2x.png (the menu-bar glyph).
         src/components/global/mark draws the identical shape inline for the web
         layer — change the path in both or neither.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="91.2" height="75.5" viewBox="0 24.5 91.2 75.5" fill="currentColor">
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="91.2" height="100" rx="22.4"/>
    </clipPath>
    <path id="quote" d="M0 0H38C72 0 100 28 100 64V120H6V62H30C52 62 52 38 30 38H2Z"/>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <g fill="#000">
        <use href="#quote" transform="translate(44.3 43.2) rotate(-4) scale(0.126)"/>
        <use href="#quote" transform="translate(60.9 42) rotate(-4) scale(0.126)"/>
      </g>
    </mask>
  </defs>
  <g clip-path="url(#tile)">
    <path mask="url(#holes)"
      d="M-6 46.5L0 45.5C12 39.5 30 26.5 47 26C63 25.5 82 36 87.4 52.5C90 60 90.8 75 91 105H-6Z"/>
  </g>
</svg>
